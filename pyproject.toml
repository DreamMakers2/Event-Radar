[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "event-radar"
version = "0.1.0"
description = "Real-time monitoring and alerting service for high-signal social media events."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.20,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1,<2",
]

[project.scripts]
event-radar = "event_radar.__main__:main"

[tool.setuptools.packages.find]
include = ["event_radar*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
